<!DOCTYPE html>
<title>jogos de terror</title>
<html lang="pt-BR">
    <style>
        body{
            background-color: black;
            display: flex;
            justify-content: center;
            text-align: center;
            align-items: center;
            height: 100vh;
        }

        .painel{
            background-color: black;
            color: aqua;
            padding: 60px;
            width: 600px;
            border-radius: 30px;
            box-shadow: 10px 20px 30px aqua;
            text-shadow: 0 0 15px aqua;
            animation: surgir 1s ease-out forwards, pulsarBrilho 4s infinite ease-in-out;


        }

        .home{
            background-color: aqua;
            color: black;
            padding: 12px;
            width: 20px;
            border-radius: 30px;
            box-shadow: 0 0 15px aqua;
            text-decoration: none;
        }

        .baixar{
            background-color: aqua;
            color: black;
            padding: 12px;
            width: 20px;
            border-radius: 30px;
            box-shadow: 0 0 15px aqua;
            text-decoration: none;
        }

        .logo{
            background-color: black;
            color: aqua;
            padding: 30px;
            width: 300px;
            border-radius: 30px;
            box-shadow: 10px 20px 30px aqua;
            text-shadow: 0 0 15px aqua;
            margin-left: 320px;
            animation: surgir 1s ease-out forwards, pulsarBrilho 4s infinite ease-in-out;
        }

        @keyframes surgir {
    from {
        opacity: 0;
        transform: translateY(50px); 
    }
    to {
        opacity: 1;
        transform: translateY(0);    
    }
}


@keyframes pulsarBrilho {
    0% {
        box-shadow: 10px 20px 20px aquamarine;
    }
    50% {
        box-shadow: 10px 20px 40px aqua; /* Brilha mais */
    }
    100% {
        box-shadow: 10px 20px 20px aquamarine;
    }
}

    </style>
    <body>
        <div class="painel">
            <a href="index.html"class="home">home</a>
            <h1>jogos de terror</h1>
            <h1>listas de jogos</h1>
            <h1>slender man</h1>
            <a href="https://www.mediafire.com/file/cbr9f9zayr7fxgx/Slender_v0.9.6.zip/file"class="baixar">abaixar</a>

        </div>
    </body>
</html>
