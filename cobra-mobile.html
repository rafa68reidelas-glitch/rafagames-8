<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jogo da Cobrinha Mobile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }
        #score-board {
            font-size: 1.4rem;
            margin-bottom: 10px;
            font-weight: bold;
        }
        canvas {
            background-color: #111;
            border: 3px solid #444;
            max-width: 90vw;
            max-height: 90vw;
            width: 340px;
            height: 340px;
        }
        /* Controles Virtuais */
        .controls {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(3, 70px);
            grid-template-rows: repeat(3, 70px);
            gap: 10px;
            justify-content: center;
        }
        .btn {
            background-color: #333;
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .btn:active {
            background-color: #555;
            transform: scale(0.95);
        }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 3; }
    </style>
</head>
<body>

    <div id="score-board">Pontos: <span id="score">0</span></div>
    
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    
    <!-- D-pad para Celular -->
    <div class="controls">
        <button class="btn" id="btn-up">↑</button>
        <button class="btn" id="btn-left">←</button>
        <button class="btn" id="btn-right">→</button>
        <button class="btn" id="btn-down">↓</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{ x: 10, y: 10 }];
        let food = { x: 5, y: 5 };
        let dx = 1;
        let dy = 0;
        let score = 0;
        let gameInterval;
        const gameSpeed = 120; // Velocidade ligeiramente menor para facilitar no celular

        function main() {
            if (hasGameEnded()) {
                alert(`Fim de Jogo! Pontuação: ${score}`);
                resetGame();
                return;
            }

            clearCanvas();
            drawFood();
            moveSnake();
            drawSnake();
        }

        function clearCanvas() {
            ctx.fillStyle = "#111";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? "#388E3C" : "#4CAF50";
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            if (snake[0].x === food.x && snake[0].y === food.y) {
                score += 10;
                scoreElement.innerText = score;
                generateFood();
            } else {
                snake.pop();
            }
        }

        function drawFood() {
            ctx.fillStyle = "#FF5252";
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) generateFood();
            });
        }

        function hasGameEnded() {
            if (snake[0].x < 0 || snake[0].x >= tileCount || snake[0].y < 0 || snake[0].y >= tileCount) return true;
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }
            return false;
        }

        function resetGame() {
            snake = [{ x: 10, y: 10 }];
            dx = 1;
            dy = 0;
            score = 0;
            scoreElement.innerText = score;
            generateFood();
            clearInterval(gameInterval);
            gameInterval = setInterval(main, gameSpeed);
        }

        // Funções de Direção
        function moveUp() { if (dy !== 1) { dx = 0; dy = -1; } }
        function moveDown() { if (dy !== -1) { dx = 0; dy = 1; } }
        function moveLeft() { if (dx !== 1) { dx = -1; dy = 0; } }
        function moveRight() { if (dx !== -1) { dx = 1; dy = 0; } }

        // Eventos de Toque nos Botões (Suporta múltiplos toques rápidos)
        document.getElementById("btn-up").addEventListener("touchstart", (e) => { e.preventDefault(); moveUp(); });
        document.getElementById("btn-down").addEventListener("touchstart", (e) => { e.preventDefault(); moveDown(); });
        document.getElementById("btn-left").addEventListener("touchstart", (e) => { e.preventDefault(); moveLeft(); });
        document.getElementById("btn-right").addEventListener("touchstart", (e) => { e.preventDefault(); moveRight(); });

        // Compatibilidade também para cliques de mouse
        document.getElementById("btn-up").addEventListener("click", moveUp);
        document.getElementById("btn-down").addEventListener("click", moveDown);
        document.getElementById("btn-left").addEventListener("click", moveLeft);
        document.getElementById("btn-right").addEventListener("click", moveRight);

        // Mantém suporte para teclado caso use no PC
        document.addEventListener("keydown", (e) => {
            if (e.keyCode === 37) moveLeft();
            if (e.keyCode === 38) moveUp();
            if (e.keyCode === 39) moveRight();
            if (e.keyCode === 40) moveDown();
        });

        // Inicia o jogo
        resetGame();
    </script>
</body>
</html>
