<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>OBBY 3D Online</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0d1b3e; overflow:hidden; font-family:'Segoe UI',sans-serif; touch-action:none; }
canvas { display:block; width:100vw; height:100vh; }

/* ── Tela de conexao ── */
#tela-connect {
  position:fixed; inset:0; z-index:200;
  background:linear-gradient(160deg,#0d1b3e,#1a3a6e,#0d1b3e);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
}
#tela-connect h1 { color:#ffd700; font-size:36px; font-weight:900;
  text-shadow:0 0 30px #ffd70088; letter-spacing:3px; margin-bottom:6px; }
#tela-connect p { color:#aac4ff; font-size:13px; text-align:center; padding:0 24px; }
.input-wrap { display:flex; flex-direction:column; gap:4px; width:min(340px,90vw); }
.input-wrap label { color:#aac4ff; font-size:12px; padding-left:4px; }
.input-wrap input {
  background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.25);
  color:#fff; font-size:15px; padding:10px 14px; border-radius:10px;
  outline:none; width:100%;
}
.input-wrap input:focus { border-color:#ffd700; }
.btn-conectar {
  background:linear-gradient(135deg,#ffd700,#ff8c00);
  color:#000; font-size:17px; font-weight:800; padding:14px 0;
  border:none; border-radius:50px; cursor:pointer; width:min(340px,90vw);
  box-shadow:0 4px 20px #ffd70066;
}
.btn-offline {
  background:rgba(255,255,255,0.1); color:#aac4ff; font-size:14px;
  padding:10px 0; border:1px solid rgba(255,255,255,0.2);
  border-radius:50px; cursor:pointer; width:min(340px,90vw);
}
#status-txt { color:#ff7070; font-size:13px; min-height:18px; text-align:center; }
.legenda { display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
  padding:0 20px; max-width:340px; }
.leg { display:flex; align-items:center; gap:6px; font-size:12px; color:#cde; }
.leg-cor { width:14px; height:14px; border-radius:3px; flex-shrink:0; }

/* ── HUD ── */
#hud { position:fixed; top:0; left:0; right:0; z-index:10; pointer-events:none;
  padding:10px 14px; }
#fase-txt { color:#fff; font-size:15px; font-weight:700; text-shadow:0 2px 6px #000; }
#mortes-txt { color:#ff7070; font-size:12px; text-shadow:0 2px 4px #000; }
#online-txt { color:#7eff9a; font-size:11px; text-shadow:0 2px 4px #000; margin-top:2px; }

/* ── Chat ── */
#chat-box {
  position:fixed; bottom:160px; left:10px; width:200px; z-index:15;
  pointer-events:none;
}
.chat-msg { color:#fff; font-size:11px; text-shadow:0 1px 4px #000;
  background:rgba(0,0,0,0.4); padding:3px 7px; border-radius:6px;
  margin-bottom:3px; animation:fadeout 5s forwards; }
@keyframes fadeout { 0%{opacity:1} 70%{opacity:1} 100%{opacity:0} }

/* ── Win ── */
#win-screen {
  position:fixed; inset:0; z-index:90; background:rgba(0,0,0,0.85);
  display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px;
}
#win-screen h2 { color:#ffd700; font-size:26px; font-weight:900; text-align:center; padding:0 20px; }
#win-screen p  { color:#cde; font-size:14px; text-align:center; padding:0 20px; }
.btn-next { background:linear-gradient(135deg,#22cc55,#118833);
  color:#fff; font-size:16px; font-weight:700; padding:13px 36px;
  border:none; border-radius:50px; cursor:pointer; }

/* ── Controles ── */
#controles {
  position:fixed; bottom:0; left:0; right:0; z-index:20;
  display:flex; justify-content:space-between; align-items:flex-end;
  padding:0 14px 18px; pointer-events:none;
}
.joystick-zone { width:130px; height:130px; position:relative; pointer-events:all; }
#joystick-base {
  width:110px; height:110px; border-radius:50%;
  background:rgba(255,255,255,0.10); border:2px solid rgba(255,255,255,0.22);
  position:absolute; top:10px; left:10px;
}
#joystick-thumb {
  width:46px; height:46px; border-radius:50%;
  background:rgba(255,255,255,0.50); border:2px solid rgba(255,255,255,0.75);
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
}
.btns-dir { display:flex; flex-direction:column; gap:8px; align-items:flex-end; pointer-events:all; }
.btn-ac {
  width:68px; height:68px; border-radius:50%;
  border:2px solid rgba(255,255,255,0.35); font-size:12px; font-weight:700;
  color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center;
  -webkit-tap-highlight-color:transparent; user-select:none;
}
#btn-pular   { background:rgba(40,180,70,0.80); }
#btn-pular:active { transform:scale(.90); }
#btn-reiniciar { background:rgba(200,60,20,0.70); width:52px; height:52px; font-size:10px; }
</style>
</head>
<body>

<!-- Tela de conexao -->
<div id="tela-connect">
  <h1>OBBY 3D</h1>
  <p>Multiplayer online para celular 📱</p>

  <div class="input-wrap">
    <label>Seu nome</label>
    <input id="inp-nome" type="text" value="Player" maxlength="12" autocomplete="off">
  </div>
  <div class="input-wrap">
    <label>IP / Endereço do servidor</label>
    <input id="inp-ip" type="text" value="127.0.0.1" autocomplete="off" placeholder="ex: 192.168.1.10 ou ngrok">
  </div>
  <div class="input-wrap">
    <label>Porta</label>
    <input id="inp-porta" type="number" value="9999">
  </div>

  <div id="status-txt"></div>

  <button class="btn-conectar" onclick="conectar()">🌐 CONECTAR E JOGAR</button>
  <button class="btn-offline"  onclick="jogarOffline()">▶ Jogar sozinho (offline)</button>

  <div class="legenda">
    <div class="leg"><div class="leg-cor" style="background:#e0e0e0"></div>Normal</div>
    <div class="leg"><div class="leg-cor" style="background:#3a80e8"></div>Móvel</div>
    <div class="leg"><div class="leg-cor" style="background:#f0c010"></div>Trampolim</div>
    <div class="leg"><div class="leg-cor" style="background:#e83020"></div>Perigo</div>
    <div class="leg"><div class="leg-cor" style="background:#ffd700"></div>Objetivo</div>
  </div>
  <p style="font-size:11px;color:#556;">Rode servidor.py em um PC e use ngrok para internet</p>
</div>

<!-- HUD -->
<div id="hud">
  <div id="fase-txt">Fase 1</div>
  <div id="mortes-txt">Mortes: 0</div>
  <div id="online-txt"></div>
</div>

<!-- Chat -->
<div id="chat-box"></div>

<!-- Win -->
<div id="win-screen">
  <h2 id="win-titulo">FASE COMPLETA!</h2>
  <p id="win-msg"></p>
  <button class="btn-next" onclick="proximaFase()">CONTINUAR ▶</button>
</div>

<!-- Canvas -->
<canvas id="c"></canvas>

<!-- Controles -->
<div id="controles">
  <div class="joystick-zone" id="jzone">
    <div id="joystick-base"><div id="joystick-thumb"></div></div>
  </div>
  <div class="btns-dir">
    <div class="btn-ac" id="btn-pular">PULAR</div>
    <div class="btn-ac" id="btn-reiniciar">RESET</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ═══════════════════════════════════════════════════════════
// FASES
// ═══════════════════════════════════════════════════════════
const LEVELS = [
  [[0,0,0,4,4,.4,'safe'],[0,6,0,3,3,.4,'safe'],[0,12,0,3,3,.4,'safe'],[0,18,0,3,3,.4,'safe'],[0,24,0,3,3,.4,'safe'],[0,30,0,4,4,.4,'goal']],
  [[0,0,0,4,4,.4,'safe'],[0,7,0,3,3,.4,'safe'],[0,14,0,3,3,.4,'danger'],[5,11,0,2,2,.4,'safe'],[5,17,0,2,2,.4,'safe'],[2,23,0,2,2,.4,'safe'],[0,29,0,3,3,.4,'safe'],[0,35,0,3,3,.4,'danger'],[4,35,0,2,2,.4,'safe'],[2,41,0,3,3,.4,'goal']],
  [[0,0,0,4,4,.4,'safe'],[0,7,0,3,3,.4,'safe'],[0,13,0,2,2,.4,'bounce'],[0,21,4,3,3,.4,'safe'],[4,27,4,2,2,.4,'moving'],[-3,33,4,2,2,.4,'moving'],[0,39,4,2,2,.4,'bounce'],[0,47,8,3,3,.4,'safe'],[4,52,8,2,2,.4,'danger'],[-4,52,8,2,2,.4,'safe'],[0,58,8,3,3,.4,'goal']],
  [[0,0,0,4,4,.4,'safe'],[0,6,0,2,2,.4,'moving'],[5,6,0,2,2,.4,'moving'],[5,12,0,2,2,.4,'safe'],[2,17,0,2,2,.4,'danger'],[6,17,0,2,2,.4,'safe'],[6,23,0,2,2,.4,'bounce'],[6,30,4,2,2,.4,'safe'],[-3,35,4,2,2,.4,'moving'],[-3,41,4,2,2,.4,'danger'],[1,41,4,2,2,.4,'safe'],[1,47,4,3,3,.4,'goal']],
  [[0,0,0,4,4,.4,'safe'],[0,6,0,3,2,.4,'danger'],[0,11,0,3,2,.4,'danger'],[0,16,0,3,2,.4,'danger'],[0,21,0,3,2,.4,'danger'],[-6,5,0,2,2,.4,'safe'],[-6,11,0,2,2,.4,'safe'],[-6,17,0,2,2,.4,'moving'],[-6,23,0,2,2,.4,'safe'],[-4,29,0,2,2,.4,'bounce'],[-4,36,4,2,2,.4,'safe'],[0,41,4,2,2,.4,'moving'],[4,46,4,2,2,.4,'safe'],[4,51,4,3,3,.4,'goal']],
  [[0,0,0,4,4,.4,'safe'],[0,6,0,2,2,.4,'bounce'],[0,14,5,3,3,.4,'safe'],[3,19,5,1,1,.4,'safe'],[-3,23,5,1,1,.4,'safe'],[3,27,5,1,1,.4,'safe'],[-3,31,5,1,1,.4,'safe'],[0,35,5,2,2,.4,'bounce'],[0,43,9,3,3,.4,'safe'],[4,48,9,2,2,.4,'danger'],[-4,48,9,2,2,.4,'danger'],[0,48,9,1,1,.4,'safe'],[0,53,9,3,3,.4,'goal']],
  [[0,0,0,4,4,.4,'safe'],[0,6,0,2,2,.4,'moving'],[0,12,0,2,2,.4,'moving'],[4,16,0,2,2,.4,'danger'],[-4,16,0,2,2,.4,'moving'],[-4,22,0,2,2,.4,'bounce'],[-4,30,4,2,2,.4,'moving'],[0,35,4,2,2,.4,'danger'],[4,35,4,2,2,.4,'safe'],[4,41,4,2,2,.4,'moving'],[0,46,4,2,2,.4,'bounce'],[0,53,8,2,2,.4,'moving'],[0,58,8,3,3,.4,'safe'],[0,64,8,3,3,.4,'goal']],
  [[0,0,0,4,4,.4,'safe'],[0,5,0,2,2,.4,'moving'],[3,9,0,2,2,.4,'danger'],[-3,9,0,2,2,.4,'moving'],[-3,14,0,1,1,.4,'safe'],[-3,18,0,2,2,.4,'bounce'],[0,25,4,2,2,.4,'safe'],[3,25,4,2,2,.4,'danger'],[3,31,4,2,2,.4,'moving'],[0,36,4,1,1,.4,'safe'],[0,41,4,2,2,.4,'bounce'],[0,48,7,2,2,.4,'moving'],[-4,53,7,2,2,.4,'danger'],[4,53,7,2,2,.4,'danger'],[0,53,7,1,1,.4,'safe'],[0,58,7,2,2,.4,'moving'],[0,63,7,3,3,.4,'goal']],
  [[0,0,0,4,4,.4,'safe'],[3,6,0,2,2,.4,'safe'],[-3,11,0,2,2,.4,'safe'],[3,16,1,2,2,.4,'safe'],[-3,21,2,2,2,.4,'danger'],[3,21,2,2,2,.4,'safe'],[3,26,2,2,2,.4,'moving'],[0,31,2,2,2,.4,'bounce'],[0,38,6,3,3,.4,'safe'],[4,43,6,1,1,.4,'safe'],[-4,48,6,1,1,.4,'safe'],[0,53,6,2,2,.4,'danger'],[4,53,6,2,2,.4,'safe'],[2,59,6,3,3,.4,'goal']],
  [[0,0,0,4,4,.4,'safe'],[0,6,0,3,3,.4,'moving'],[0,13,0,3,3,.4,'moving'],[0,20,0,2,2,.4,'danger'],[4,20,0,2,2,.4,'moving'],[4,27,0,2,2,.4,'safe'],[0,32,0,2,2,.4,'bounce'],[0,39,5,2,2,.4,'moving'],[-4,44,5,2,2,.4,'moving'],[0,49,5,2,2,.4,'danger'],[4,49,5,2,2,.4,'safe'],[0,55,5,2,2,.4,'bounce'],[0,63,9,3,3,.4,'safe'],[4,68,9,1,1,.4,'danger'],[-4,68,9,1,1,.4,'danger'],[0,68,9,1,1,.4,'safe'],[0,74,9,4,4,.4,'goal']],
];

const CORES = {safe:0xe0e0e0,danger:0xe83020,moving:0x3a80e8,bounce:0xf0c010,goal:0xffd700};
const CORES_JOGADOR = [0x22cc55, 0x3a80e8, 0xe83020, 0xf0c010];

// ═══════════════════════════════════════════════════════════
// THREE.JS
// ═══════════════════════════════════════════════════════════
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x3060b0);
scene.fog = new THREE.Fog(0x3060b0, 35, 95);

const camera = new THREE.PerspectiveCamera(70,1,.1,200);

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
}
resize(); window.addEventListener('resize', resize);

scene.add(new THREE.AmbientLight(0x8899cc, 0.6));
const sun = new THREE.DirectionalLight(0xfff0dd, 1.2);
sun.position.set(15,20,10); sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
scene.add(sun);

function makeBox(w,d,h,color) {
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(w*2,d*2,h*2),
    new THREE.MeshLambertMaterial({color})
  );
  m.castShadow = m.receiveShadow = true;
  return m;
}

function makePlayer(cor) {
  const g = new THREE.Group();
  const torso = makeBox(.28,.18,.32,cor); torso.position.set(0,0,.82); g.add(torso);
  const cl = makeBox(.12,.12,.30,0x2244aa); cl.position.set(-.14,0,.30); g.add(cl);
  const cr = makeBox(.12,.12,.30,0x2244aa); cr.position.set( .14,0,.30); g.add(cr);
  const pl = makeBox(.13,.17,.06,0x111111); pl.position.set(-.14,.05,.06); g.add(pl);
  const pr = makeBox(.13,.17,.06,0x111111); pr.position.set( .14,.05,.06); g.add(pr);
  const cab = makeBox(.22,.20,.22,0xdba878); cab.position.set(0,0,1.55); g.add(cab);
  const cab2= makeBox(.23,.21,.09,0x442200); cab2.position.set(0,0,1.77); g.add(cab2);
  const al = makeBox(.09,.09,.26,0xdba878); al.position.set(-.38,0,.78); g.add(al);
  const ar = makeBox(.09,.09,.26,0xdba878); ar.position.set( .38,0,.78); g.add(ar);
  g._legs = [cl, cr, al, ar];
  return g;
}

// Jogador local
const playerGroup = makePlayer(CORES_JOGADOR[0]);
scene.add(playerGroup);
playerGroup.position.set(0,0,1.5);

// ═══════════════════════════════════════════════════════════
// REDE — WebSocket bridge via servidor Python
// ═══════════════════════════════════════════════════════════
let ws = null;
let myId = null;
let myNome = 'Player';
let netPlayers = {}; // id -> {group, nome, label}
let online = false;

// Servidor Python usa TCP sockets, mas celular precisa de WebSocket.
// O servidor.py vai aceitar conexoes WebSocket com a lib websockets.
// Para simplicidade, usamos o protocolo JSON sobre WebSocket.

function conectar() {
  const nome  = document.getElementById('inp-nome').value.trim() || 'Player';
  const ip    = document.getElementById('inp-ip').value.trim();
  const porta = document.getElementById('inp-porta').value.trim() || '9999';
  myNome = nome;

  const statusEl = document.getElementById('status-txt');
  statusEl.textContent = 'Conectando...';
  statusEl.style.color = '#ffd700';

  try {
    // Tenta ws:// (WebSocket) — requer servidor com suporte WS
    ws = new WebSocket(`ws://${ip}:${porta}`);

    ws.onopen = () => {
      ws.send(JSON.stringify({type:'join', nome}));
      statusEl.textContent = 'Conectado!';
      statusEl.style.color = '#7eff9a';
      online = true;
      setTimeout(() => iniciarJogo(), 800);
    };

    ws.onmessage = e => {
      try {
        const msg = JSON.parse(e.data);
        handleNet(msg);
      } catch {}
    };

    ws.onerror = () => {
      statusEl.textContent = 'Erro de conexão. Verifique o IP e porta.';
      statusEl.style.color = '#ff7070';
      ws = null;
    };

    ws.onclose = () => {
      online = false;
      document.getElementById('online-txt').textContent = '❌ Desconectado';
    };
  } catch(e) {
    statusEl.textContent = `Erro: ${e.message}`;
    statusEl.style.color = '#ff7070';
  }
}

function handleNet(msg) {
  const t = msg.type;
  if (t === 'welcome') {
    myId = msg.id;
    document.getElementById('online-txt').textContent = `🌐 Online | ID ${myId}`;
    // Cria jogadores que já estavam
    for (const [pid, info] of Object.entries(msg.players || {})) {
      if (parseInt(pid) !== myId) criarNetPlayer(parseInt(pid), info);
    }
  } else if (t === 'join') {
    if (msg.id !== myId) criarNetPlayer(msg.id, msg);
    addChat(`${msg.nome} entrou no jogo!`);
  } else if (t === 'pos') {
    if (netPlayers[msg.id]) {
      netPlayers[msg.id].group.position.set(msg.x, msg.y, msg.z);
      netPlayers[msg.id].group.rotation.z = msg.yaw * Math.PI/180;
    }
  } else if (t === 'disconnect') {
    if (netPlayers[msg.id]) {
      scene.remove(netPlayers[msg.id].group);
      delete netPlayers[msg.id];
    }
  } else if (t === 'chat') {
    addChat(`${msg.nome}: ${msg.msg}`);
  } else if (t === 'error') {
    document.getElementById('status-txt').textContent = msg.msg;
  }
}

function criarNetPlayer(pid, info) {
  if (netPlayers[pid]) return;
  const cor = CORES_JOGADOR[pid % CORES_JOGADOR.length];
  const g = makePlayer(cor);
  scene.add(g);
  netPlayers[pid] = {group:g, nome: info.nome || `P${pid}`};
}

function enviarPos() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  const p = playerGroup.position;
  ws.send(JSON.stringify({
    type:'pos',
    x: +p.x.toFixed(2), y: +p.y.toFixed(2), z: +p.z.toFixed(2),
    yaw: +camYaw.toFixed(1),
    fase: levelIdx, mortes: deaths
  }));
}

function addChat(txt) {
  const box = document.getElementById('chat-box');
  const div = document.createElement('div');
  div.className = 'chat-msg';
  div.textContent = txt;
  box.appendChild(div);
  setTimeout(() => div.remove(), 5500);
}

// ═══════════════════════════════════════════════════════════
// JOGO
// ═══════════════════════════════════════════════════════════
let levelIdx=0, deaths=0;
let platMeshes=[], movingPlats=[];
let velY=0, grounded=false, onBounce=false;
let camYaw=0, won=false;
const SPAWN = new THREE.Vector3(0,0,1.5);

function loadLevel(idx) {
  platMeshes.forEach(m => scene.remove(m));
  platMeshes=[]; movingPlats=[];
  const level = LEVELS[idx];
  for (const [x,y,z,sx,sy,sz,type] of level) {
    const m = makeBox(sx,sy,sz, CORES[type]??CORES.safe);
    m.position.set(x,y,z);
    m.userData = {x,y,z,sx,sy,sz,type};
    scene.add(m); platMeshes.push(m);
    if (type==='moving') {
      movingPlats.push({mesh:m,ox:x,oy:y,oz:z,
        phase:Math.random()*Math.PI*2,
        axis:Math.random()<.5?'x':'y',
        amp:1.5+Math.random()*2, spd:.8+Math.random()*.8});
    }
  }
  const lava = makeBox(60,80,.3,0xb84010);
  lava.position.set(0,20,-4);
  lava.userData={x:0,y:20,z:-4,sx:60,sy:80,sz:.3,type:'danger'};
  scene.add(lava); platMeshes.push(lava);

  playerGroup.position.copy(SPAWN);
  velY=0; grounded=false; camYaw=0; won=false;
  document.getElementById('fase-txt').textContent = `Fase ${idx+1} / ${LEVELS.length}`;
  document.getElementById('mortes-txt').textContent = `Mortes: ${deaths}`;
}

// ── Joystick ──────────────────────────────────────────────
const jzone = document.getElementById('jzone');
const jthumb = document.getElementById('joystick-thumb');
const joy = {active:false, id:-1, cx:0, cy:0, dx:0, dy:0};
let jumpPressed=false, jumpHeld=false;
let lastTouchX=null, lastTouchId=-1;

jzone.addEventListener('touchstart', e=>{
  e.preventDefault();
  const t=e.changedTouches[0], r=jzone.getBoundingClientRect();
  joy.active=true; joy.id=t.identifier;
  joy.cx=r.left+r.width/2; joy.cy=r.top+r.height/2;
},{passive:false});

jzone.addEventListener('touchmove', e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier===joy.id){
      const dx=t.clientX-joy.cx, dy=t.clientY-joy.cy;
      const dist=Math.min(Math.hypot(dx,dy),42);
      const ang=Math.atan2(dy,dx);
      joy.dx=Math.cos(ang)*dist/42; joy.dy=Math.sin(ang)*dist/42;
      jthumb.style.transform=`translate(calc(-50% + ${Math.cos(ang)*dist}px),calc(-50% + ${Math.sin(ang)*dist}px))`;
    }
  }
},{passive:false});

['touchend','touchcancel'].forEach(ev=>jzone.addEventListener(ev,e=>{
  joy.active=false; joy.dx=0; joy.dy=0;
  jthumb.style.transform='translate(-50%,-50%)';
},{passive:false}));

// Swipe para camera
document.addEventListener('touchstart', e=>{
  for(const t of e.touches){
    if(t.identifier!==joy.id){ lastTouchX=t.clientX; lastTouchId=t.identifier; break; }
  }
},{passive:true});
document.addEventListener('touchmove', e=>{
  for(const t of e.touches){
    if(t.identifier===lastTouchId && t.identifier!==joy.id){
      camYaw -= (t.clientX-lastTouchX)*.28;
      lastTouchX=t.clientX;
    }
  }
},{passive:true});

document.getElementById('btn-pular').addEventListener('touchstart',e=>{e.preventDefault();jumpPressed=true;},{passive:false});
document.getElementById('btn-pular').addEventListener('touchend',  e=>{e.preventDefault();jumpPressed=false;},{passive:false});
document.getElementById('btn-reiniciar').addEventListener('touchstart',e=>{
  e.preventDefault(); respawn();
},{passive:false});

// ── Loop ──────────────────────────────────────────────────
const GRAVITY=-18, JUMP=8, BOUNCE_VEL=14, SPEED=5;
let lastT=performance.now();
let posTimer=0;
let animT=0;

function gameLoop(now) {
  requestAnimationFrame(gameLoop);
  if(won) return;
  const dt=Math.min((now-lastT)/1000,.05); lastT=now;
  const t=now/1000;

  // Movimento
  if(joy.active && (joy.dx||joy.dy)){
    const yr=camYaw*Math.PI/180;
    const fwd=new THREE.Vector3(-Math.sin(yr),Math.cos(yr),0);
    const rgt=new THREE.Vector3( Math.cos(yr),Math.sin(yr),0);
    playerGroup.position.addScaledVector(fwd,-joy.dy*SPEED*dt);
    playerGroup.position.addScaledVector(rgt, joy.dx*SPEED*dt);
    const ang=Math.atan2(joy.dx,-joy.dy)+yr;
    playerGroup.rotation.z=ang;
    animT+=dt*8;
  }

  // Pulo
  if(jumpPressed&&!jumpHeld&&grounded){
    velY=onBounce?BOUNCE_VEL:JUMP; grounded=false; onBounce=false;
  }
  jumpHeld=jumpPressed;

  // Gravidade
  velY+=GRAVITY*dt;
  playerGroup.position.z+=velY*dt;

  // Colisao
  grounded=false; onBounce=false;
  const {x:px,y:py,z:pz}=playerGroup.position;
  for(const m of platMeshes){
    const {x,y,z,sx,sy,sz,type}=m.userData;
    const rx=m.position.x, ry=m.position.y, rz=m.position.z;
    const top=rz+sz;
    if(rx-sx-.55<px&&px<rx+sx+.55&&ry-sy-.55<py&&py<ry+sy+.55&&
       top-.15<=pz&&pz<=top+1.1&&velY<=.05){
      if(type==='danger'){respawn();return;}
      playerGroup.position.z=top+.6; velY=0; grounded=true;
      onBounce=(type==='bounce');
      if(type==='goal'){showWin();return;}
    }
  }
  if(pz<-2){respawn();return;}

  // Plataformas moveis
  for(const mp of movingPlats){
    const off=Math.sin(t*mp.spd+mp.phase)*mp.amp;
    if(mp.axis==='x') mp.mesh.position.set(mp.ox+off,mp.oy,mp.oz);
    else              mp.mesh.position.set(mp.ox,mp.oy+off,mp.oz);
    mp.mesh.userData.x=mp.mesh.position.x;
    mp.mesh.userData.y=mp.mesh.position.y;
  }

  // Animacao pernas
  const sw=Math.sin(animT)*.08;
  const legs=playerGroup._legs;
  if(legs){
    legs[0].position.z=.30+sw; legs[1].position.z=.30-sw;
    legs[2].position.z=.78-sw*.5; legs[3].position.z=.78+sw*.5;
  }

  // Camera
  const pos=playerGroup.position;
  const yr=camYaw*Math.PI/180;
  const dist=10;
  camera.position.set(
    pos.x+Math.sin(yr)*dist,
    pos.y-Math.cos(yr)*dist,
    pos.z+4
  );
  camera.lookAt(pos.x,pos.y,pos.z+1);

  // Envia posicao a cada 50ms
  posTimer+=dt;
  if(posTimer>.05){ posTimer=0; enviarPos(); }

  renderer.render(scene,camera);
}

function respawn(){
  deaths++;
  playerGroup.position.copy(SPAWN);
  velY=0; grounded=false;
  document.getElementById('mortes-txt').textContent=`Mortes: ${deaths}`;
}

function showWin(){
  won=true;
  const ws2=document.getElementById('win-screen');
  ws2.style.display='flex';
  if(levelIdx<LEVELS.length-1){
    document.getElementById('win-titulo').textContent=`✅ FASE ${levelIdx+1} COMPLETA!`;
    document.getElementById('win-msg').textContent=`Mortes: ${deaths}`;
  } else {
    document.getElementById('win-titulo').textContent='🏆 VOCÊ ZEROU!';
    document.getElementById('win-msg').textContent=`Total de mortes: ${deaths}`;
    document.querySelector('.btn-next').textContent='JOGAR DE NOVO';
  }
}

function proximaFase(){
  document.getElementById('win-screen').style.display='none';
  levelIdx = levelIdx<LEVELS.length-1 ? levelIdx+1 : 0;
  if(levelIdx===0) deaths=0;
  loadLevel(levelIdx);
}

function iniciarJogo(){
  document.getElementById('tela-connect').style.display='none';
  loadLevel(0);
  lastT=performance.now();
  requestAnimationFrame(gameLoop);
}

function jogarOffline(){
  online=false;
  document.getElementById('online-txt').textContent='';
  iniciarJogo();
}
</script>
